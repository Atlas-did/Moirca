<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moirca 填报助手 — 设置</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
    font-size: 13px; color: #1f2937;
    background: #f9fafb;
    max-width: 700px; margin: 0 auto; padding: 24px 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; color: #374151; }
  input, select {
    width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; margin-bottom: 10px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 500;
    border: 1px solid #d1d5db; background: #fff; color: #374151; transition: all .15s; font-family: inherit;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  button.primary:hover { background: #4338ca; }
  button.danger { color: #dc2626; border-color: #fecaca; }
  button.danger:hover { background: #fef2f2; }
  .profile-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; background: #f9fafb; border-radius: 6px; margin-bottom: 4px;
  }
  .tag {
    display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px;
    font-weight: 600; margin-left: 6px;
  }
  .tag.active { background: #dbeafe; color: #1d4ed8; }
  .status-msg { font-size: 11px; color: #16a34a; margin-top: 4px; display: none; }
  .status-msg.show { display: block; }
</style>
</head>
<body>
<h1>⚙️ Moirca 填报助手 · 设置</h1>
<p style="color:#6b7280;font-size:12px;margin-bottom:20px;">管理用户档案、查看省份配置、导出数据</p>

<!-- 用户档案 -->
<h2>👤 用户档案</h2>
<div class="card">
  <div id="profileList"></div>
  <div style="margin-top:12px; padding-top:12px; border-top:1px solid #e5e7eb;">
    <div class="row">
      <div><label>分数</label><input id="profScore" type="number" placeholder="585"></div>
      <div><label>省份</label><input id="profProvince" type="text" placeholder="广东"></div>
    </div>
    <div class="row">
      <div><label>选科</label>
        <select id="profSubject">
          <option value="">请选择</option>
          <option>物理类</option><option>历史类</option><option>综合</option>
        </select>
      </div>
      <div><label>位次（可选）</label><input id="profRank" type="number" placeholder="35000"></div>
    </div>
    <button class="primary" id="btnAddProfile">+ 添加档案</button>
  </div>
</div>

<!-- 偏好设置 -->
<h2>🔧 偏好设置</h2>
<div class="card">
  <label><input type="checkbox" id="prefAutoDetect" checked> 自动检测志愿填报表单</label>
  <label style="margin-top:6px;"><input type="checkbox" id="prefShowPanel" checked> 显示浮动面板</label>
  <button class="primary" id="btnSavePrefs" style="margin-top:10px;">保存设置</button>
  <div class="status-msg" id="prefMsg">✅ 已保存</div>
</div>

<!-- 省份支持列表 -->
<h2>🗺️ 支持的省份（7个）</h2>
<div class="card" id="provinceSupportList">
  <div style="font-size:11px;color:#6b7280;">广东、浙江、山东、江苏、河南、四川、湖北</div>
</div>

<!-- 数据管理 -->
<h2>📦 数据管理</h2>
<div class="card">
  <div style="display:flex;gap:8px;">
    <button id="btnExportData">📥 导出历史数据</button>
    <button class="danger" id="btnClearData">🗑️ 清除本地数据</button>
  </div>
  <div class="status-msg" id="dataMsg"></div>
</div>

<script src="options.js"></script>
</body>
</html>
