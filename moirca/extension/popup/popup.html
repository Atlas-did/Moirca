<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 280px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 12px;
    color: #1f2937;
    background: #fff;
  }
  .header {
    padding: 10px 14px;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .body { padding: 12px 14px; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    margin-bottom: 10px;
    font-size: 11px;
  }
  .status-row.inactive { background: #f9fafb; border-color: #e5e7eb; color: #9ca3af; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
  .status-dot.inactive { background: #d1d5db; }
  .btn {
    display: flex; align-items: center; gap: 6px;
    width: 100%; padding: 8px 12px; margin-bottom: 6px;
    border: 1px solid #e5e7eb; border-radius: 8px;
    background: #f9fafb; color: #374151;
    cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all .15s; text-align: left; font-family: inherit;
  }
  .btn:hover { background: #f3f4f6; border-color: #d1d5db; }
  .btn:last-child { margin-bottom: 0; }
  .btn.primary { background: #eef2ff; border-color: #c7d2fe; color: #4338ca; }
  .btn.primary:hover { background: #e0e7ff; }
  .btn.danger { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
  .sep { height: 1px; background: #e5e7eb; margin: 8px 0; }
  .province-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600; background: #dbeafe; color: #1d4ed8;
  }
  .footer {
    padding: 8px 14px;
    border-top: 1px solid #f3f4f6;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer a { color: #6366f1; text-decoration: none; font-size: 11px; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="header">🔧 Moirca 填报助手</div>
<div class="body">
  <div id="statusRow" class="status-row inactive">
    <span class="status-dot inactive" id="statusDot"></span>
    <span id="statusText">未检测到支持的填报系统</span>
  </div>

  <button class="btn primary" id="btnFill">✍️ 一键填充当前页面</button>
  <button class="btn" id="btnRead">👁️ 读取已填志愿</button>
  <button class="btn" id="btnExport">📥 导出当前页数据</button>

  <div class="sep"></div>

  <button class="btn" id="btnOptions">⚙️ 管理档案 & 设置</button>
</div>
<div class="footer">
  <span style="font-size:10px;color:#9ca3af;">v0.1.0 · 7省支持</span>
  <a href="#" id="linkGuide">使用指南</a>
</div>
<script src="popup.js"></script>
</body>
</html>
