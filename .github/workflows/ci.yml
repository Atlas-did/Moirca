# ============================================================
# WebBridge CI(AGENT_07,CONTRACT §附 + 审计任务书 A8)
# 原则:任何 job 不允许 continue-on-error;红即挡合并。
# ============================================================
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend(pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Test (pytest)
        run: python -m pytest tests/ -q

  skills:
    name: skills(pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Test skill 格式一致性
        run: python -m pytest skills/tests -q

  node:
    name: shared-types/daemon/extension(npm test + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspaces
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck shared-types
        run: npm run typecheck -w shared-types
      - name: Typecheck daemon
        run: npm run typecheck -w daemon
      - name: Typecheck extension
        run: npm run typecheck -w extension
      - name: Test daemon
        run: npm test -w daemon
      - name: Test extension
        run: npm test -w extension

  drift:
    name: contract-drift(§附 CI 校验)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspaces
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 9222 禁用 / shared-types 双侧一致 / MCP 工具名 / 错误码枚举 / workspace 解析
        run: node scripts/check-drift.mjs

  secrets:
    name: secrets(gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
